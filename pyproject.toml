[project]
name = "fastdocling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan Ravindra", email = "karan.ravindra@watts.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "cut-cross-entropy @ git+https://github.com/apple/ml-cross-entropy.git",
    "datasets>=5.0.1",
    "docling-core>=2.0.0",
    "huggingface-hub>=1.31.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.11.2",
    "scipy>=1.14.0",
    "torch>=2.13.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.scripts]
fastdocling = "fastdocling:main"
fastdocling-prep = "fastdocling.prep:main"
fastdocling-extract = "fastdocling.extract:main"
fastdocling-pack = "fastdocling.data:main"

# vLLM loads this in every process (including spawned workers), which is the only
# hook that reaches the EngineCore that actually builds the model.
[project.entry-points."vllm.general_plugins"]
fastdocling_idefics3_eagle3 = "fastdocling.backends._vllm_idefics3:register"
# Fixes vLLM 0.29's Medusa loader so a pruned (token_map) draft head can load at all.
fastdocling_medusa_token_map = "fastdocling.backends._vllm_medusa:register"

[project.optional-dependencies]
# Backends are mutually exclusive: a machine is either Apple Silicon or CUDA.
#   uv sync --extra mlx     (Mac)   torch 2.14 - measurably faster on Metal
#   uv sync --extra cuda    (CUDA)  torch 2.13 - pinned exactly by vllm
mlx = ["mlx-vlm>=0.4.0", "torch>=2.14.0", "torchvision>=0.29.0"]
cuda = ["vllm>=0.18.0"]

[tool.uv]
conflicts = [[{ extra = "mlx" }, { extra = "cuda" }]]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
